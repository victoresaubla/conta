workflows:
  android-apk:
    name: C&B - APK de prueba
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Verificar Gradle Wrapper
        script: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Limpiar proyecto
        script: |
          ./gradlew clean

      - name: Generar APK Debug
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk

  android-release:
    name: C&B - APK y AAB de publicación
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17
      android_signing:
        - cb_keystore

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Verificar Gradle Wrapper
        script: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Limpiar proyecto
        script: |
          ./gradlew clean

      - name: Generar APK y AAB Release
        script: |
          ./gradlew assembleRelease bundleRelease

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/outputs/mapping/release/**
